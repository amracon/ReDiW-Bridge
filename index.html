<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <script src="https://cesium.com/downloads/cesiumjs/releasesum.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet">

    <style>
       th: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div id="cesiumContainer"></div>

<script>

const viewer = new Cesium.Viewer('cesiumContainer');

viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(
        -2.359,
        51.381,
        2000
    )
});

</script>

</body>

</html>
